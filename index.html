<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonaga Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="main-layout">
        
        <div class="left-column">
            
            <div id="room-display" class="room-info" style="display: none;">
                <span>Sala: </span>
                <strong id="room-code-text">---</strong>
                <button id="btn-copy" class="btn btn-outline btn-small">📋 Copiar Link</button>
            </div>

            <div id="game-info">
                <p id="status-text">Iniciando...</p>
            </div>

            <div id="game-container">
                <svg id="game-board"></svg>
            </div>
            
        </div>

        <div class="right-column">
            <div class="menu-card">
                <h1>Nonaga</h1>
                
                <div id="connection-panel">
                    <input type="text" id="room-input" class="input-field" placeholder="Código de sala...">
                    <button id="btn-join" class="btn btn-green">Unirse a Sala</button>
                    
                    <div class="divider">— o —</div>

                    <button id="btn-create-game" class="btn btn-blue">Crear Sala Random</button>

                    <div class="divider">— o jugar acá —</div>

                    <div class="bot-controls">
                        <button id="btn-mode-toggle" class="btn btn-outline">Modo: vs Bot (Medio)</button>
                    </div>
                </div>

                <div class="rules-container">
                    <ol class="simple-rules">
                        <li>Rojo mueve un peón hasta chocar con algo.</li>
                        <li>Rojo mueve un hexágono vacío del borde.</li>
                        <li>Juega Azul. El primero en juntar sus 3 fichas gana.</li>
                    </ol>
                    <p class="author-credit">
                        Juego original de <a href="https://matematicamente.es/GAMES/Nonaga_ES.pdf" target="_blank" rel="noopener noreferrer" class="rules-link">Víktor Bautista i Roca</a> (Steffen Spiele)
                    </p>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
