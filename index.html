<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonaga Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="main-layout">
        
        <div class="left-column">
            
            <div id="room-display" class="room-info" style="display: none;">
                <span>Sala: </span>
                <strong id="room-code-text">---</strong>
                <button id="btn-copy" class="btn btn-outline btn-small">📋 Copiar Room ID</button>
            </div>

            <div id="game-info">
                <p id="status-text">Iniciando...</p>
            </div>

            <div id="game-container">
                <svg id="game-board"></svg>
            </div>
            
        </div>

        <div class="right-column">
            <div class="menu-card">
                <h1>Nonaga</h1>
                
                <div id="connection-panel">
                    <input type="text" id="room-input" class="input-field" placeholder="Código de sala...">
                    <button id="btn-join" class="btn btn-green">Unirse a Sala</button>
                    
                    <div class="divider">— o —</div>

                    <button id="btn-create-game" class="btn btn-blue">Crear Sala Random</button>
                    
                    <p id="room-link" style="display: none;"></p>
                </div>

                <div class="rules-container">
                    <a href="https://matematicamente.es/GAMES/Nonaga_ES.pdf" target="_blank" class="rules-link">📖 Cómo jugar (Reglas en PDF)</a>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
