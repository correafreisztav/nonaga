<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonaga Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="landing-view" class="landing-wrapper">
        
        <div class="landing-left">
            <img src="image_438fdb.png" alt="Tablero de Nonaga" class="landing-image">
        </div>

        <div class="landing-right">
            <div class="landing-menu">
                <h1>Nonaga</h1>
                
                <div id="connection-panel" class="panel">
                    <input type="text" id="room-input" placeholder="Código de sala...">
                    <button id="btn-join" class="btn btn-green">Unirse a Sala</button>
                    
                    <span class="divider"> — o — </span>

                    <button id="btn-create-game" class="btn btn-blue">Crear Sala Random</button>
                    
                    <p id="room-link" class="room-link-text" style="display: none;"></p>
                </div>

                <div class="secondary-options">
                    <button id="btn-local-game" class="btn btn-outline btn-small">Jugar Local (1 pantalla)</button>
                    
                    <a href="https://matematicamente.es/GAMES/Nonaga_ES.pdf" target="_blank" class="rules-link">📖 Cómo jugar (Reglas en PDF)</a>
                </div>
            </div>
        </div>
    </div>

    <div id="game-view" class="game-wrapper" style="display: none;">
        
        <div class="game-header">
            <h2>Nonaga</h2>
            <div id="room-display" class="room-info" style="display: none;">
                <span>Sala: </span>
                <strong id="room-code-text">---</strong>
                <button id="btn-copy" class="btn btn-small btn-white">📋 Copiar ID</button>
            </div>
            <button id="btn-leave" class="btn btn-outline btn-small">Salir</button>
        </div>

        <div id="game-info">
            <p id="status-text">Iniciando...</p>
        </div>

        <div id="game-container">
            <svg id="game-board"></svg>
        </div>
    </div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
